<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="/assets/site.css">
<style>
  html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
  .og { width: 1200px; height: 630px; display: grid; grid-template-rows: auto 1fr 190px; padding: 56px 64px 0; box-sizing: border-box; }
  .og .name { font-size: 104px; margin: 0.18em 0 0; }
  .og .role { font-size: 26px; }
  .og-foot { display: flex; justify-content: space-between; align-items: end; padding-bottom: 18px; font-family: var(--f-display); font-size: 22px; color: var(--steel); }
  .og-chart { margin: 0 -64px; height: 190px; background: var(--surface); border-top: 1px solid var(--rule); }
  .og-chart canvas { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div class="og">
  <div>
    <p class="role" id="role">AI engineer, Gebze, Kocaeli</p>
    <h1 class="name">Bora Taykut <span class="name-last">Hindal</span></h1>
  </div>
  <div class="og-foot"><span id="tag">Predictive maintenance, LLM pipelines, graph neural networks</span><span>taykuth.github.io</span></div>
  <div class="og-chart"><canvas id="trace" data-y-label="vibration, mm/s" data-threshold="alert threshold" data-now="now" data-hours="h"></canvas></div>
</div>
<script>
  var q = new URLSearchParams(location.search);
  if (q.get("lang") === "tr") {
    document.documentElement.lang = "tr";
    document.getElementById("role").textContent = "Yapay zeka mühendisi, Gebze, Kocaeli";
    document.getElementById("tag").textContent = "Kestirimci bakım, LLM veri hatları, graf sinir ağları";
    var c = document.getElementById("trace");
    c.dataset.yLabel = "titreşim, mm/s"; c.dataset.threshold = "alarm eşiği"; c.dataset.now = "şimdi"; c.dataset.hours = "sa";
  }
</script>
<script src="/assets/site.js"></script>
</body>
</html>
